<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle du Jour — Illumin&Son</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  body {
    background: linear-gradient(160deg,#04080f 0%,#0a1535 50%,#081028 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif;
  }

  .oracle-scene {
    display:flex; flex-direction:column; align-items:center;
    gap:18px; padding:32px 16px 44px;
    width:100%; max-width:420px;
    position:relative; overflow:hidden;
  }

  .logo-text {
    font-family:'Cinzel Decorative',serif;
    font-size:15px; letter-spacing:0.14em; color:#c9a84c;
    text-shadow:0 0 24px rgba(180,140,60,0.4); text-align:center;
  }
  .sub-text {
    font-family:'Cormorant Garamond',serif; font-size:11px;
    letter-spacing:0.3em; color:rgba(180,140,60,0.5);
    text-transform:uppercase; margin-top:4px; text-align:center;
  }
  .divline {
    width:80px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(180,140,60,0.6),transparent);
  }
  .ether-text {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:13px; letter-spacing:0.12em;
    color:rgba(180,140,60,0); text-align:center; height:20px;
    transition:color 0.8s ease; pointer-events:none;
  }
  .ether-text.visible { color:rgba(180,140,60,0.75); }

  /* ── Carte ── */
  .card-stage {
    position:relative; width:250px; height:375px;
    perspective:1000px; flex-shrink:0;
  }
  .card-spin {
    width:100%; height:100%;
    position:relative; transform-style:preserve-3d;
    transform-origin:center center;
  }
  .card-face {
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:12px; overflow:hidden;
    box-shadow:0 8px 48px rgba(0,0,0,0.8),0 0 40px rgba(180,140,60,0.15);
  }
  .card-front { transform:rotateY(180deg); }

  .card-glow {
    position:absolute; inset:-14px; border-radius:26px;
    pointer-events:none; opacity:0;
    box-shadow:0 0 50px rgba(201,168,76,0.55);
  }

  /* ── Bouton ── */
  .btn-reveal {
    font-family:'Cinzel Decorative',serif; font-size:10px;
    letter-spacing:0.2em; color:#c9a84c; background:transparent;
    border:1px solid rgba(180,140,60,0.55); border-radius:4px;
    padding:12px 28px; cursor:pointer; transition:all 0.3s;
  }
  .btn-reveal:hover { background:rgba(180,140,60,0.1); box-shadow:0 0 20px rgba(180,140,60,0.2); }

  /* ── Message ── */
  .msg-box {
    max-width:360px; width:100%;
    background:rgba(10,18,50,0.8); border:1px solid rgba(180,140,60,0.25);
    border-radius:12px; padding:20px 22px; text-align:center;
    opacity:0; transform:translateY(14px);
    transition:opacity 1.4s ease,transform 1.4s ease; pointer-events:none;
  }
  .msg-box.show { opacity:1; transform:translateY(0); pointer-events:all; }
  .msg-label {
    font-family:'Cinzel Decorative',serif; font-size:7.5px;
    letter-spacing:0.35em; color:rgba(180,140,60,0.55); margin-bottom:10px;
  }
  .msg-text {
    font-family:'Cormorant Garamond',serif; font-size:15px;
    font-style:italic; line-height:1.8; color:#ddd0b8;
  }

  /* ── Panneaux ── */
  .panels {
    display:flex; flex-direction:column; gap:10px;
    max-width:360px; width:100%;
    opacity:0; transform:translateY(10px);
    transition:opacity 1.2s ease 0.4s,transform 1.2s ease 0.4s;
    pointer-events:none;
  }
  .panels.show { opacity:1; transform:translateY(0); pointer-events:all; }
  .panel-row { display:flex; gap:10px; }
  .panel {
    flex:1; border-radius:8px; padding:10px 13px;
    font-family:'Cormorant Garamond',serif; font-size:13px; line-height:1.55;
  }
  .panel-label {
    font-family:'Cinzel Decorative',serif; font-size:7px;
    letter-spacing:0.28em; display:block; margin-bottom:5px; opacity:0.65;
  }
  .panel.lumiere { background:rgba(201,168,76,0.07); border:0.5px solid rgba(201,168,76,0.25); color:#d4b96a; }
  .panel.ombre   { background:rgba(80,40,10,0.18);   border:0.5px solid rgba(180,100,40,0.22); color:#b07840; }
  .panel.vigilance {
    background:rgba(30,25,55,0.3); border:0.5px solid rgba(140,110,180,0.22);
    color:#b8a8d0; font-style:italic;
  }

  /* ── CTA ── */
  .cta-row {
    display:flex; gap:10px; flex-direction:column; align-items:center;
    width:100%; max-width:310px;
    opacity:0; transition:opacity 1.2s ease 0.8s; pointer-events:none;
  }
  .cta-row.show { opacity:1; pointer-events:all; }
  .btn-rdv {
    width:100%; font-family:'Cinzel Decorative',serif;
    font-size:9px; letter-spacing:0.18em; color:#06090f;
    background:linear-gradient(135deg,#a07828,#c9a84c,#f0d080);
    border:none; border-radius:4px; padding:13px 20px;
    cursor:pointer; transition:all 0.3s; text-decoration:none;
    display:block; text-align:center;
  }
  .btn-rdv:hover { opacity:0.88; transform:translateY(-1px); }
  .btn-contact {
    width:100%; font-family:'Cormorant Garamond',serif;
    font-size:14px; letter-spacing:0.1em; color:#c9a84c;
    background:transparent; border:1px solid rgba(180,140,60,0.4);
    border-radius:4px; padding:11px 20px;
    cursor:pointer; transition:all 0.3s; text-decoration:none;
    display:block; text-align:center;
  }
  .btn-contact:hover { border-color:#c9a84c; background:rgba(180,140,60,0.06); }

  /* ── Demain ── */
  .tomorrow-box {
    max-width:360px; width:100%; text-align:center;
    padding:14px 18px;
    background:rgba(10,18,50,0.5); border:1px solid rgba(180,140,60,0.15);
    border-radius:10px;
    opacity:0; transition:opacity 1.2s ease 1s; pointer-events:none;
  }
  .tomorrow-box.show { opacity:1; }
  .tomorrow-text {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:13px; letter-spacing:0.07em; color:rgba(180,140,60,0.55); line-height:1.6;
  }

  /* ── Déjà tiré ── */
  .already-box {
    max-width:360px; width:100%; text-align:center;
    padding:28px 22px;
    background:rgba(10,18,50,0.8); border:1px solid rgba(180,140,60,0.25);
    border-radius:12px;
  }
  .already-title {
    font-family:'Cinzel Decorative',serif; font-size:9px;
    letter-spacing:0.22em; color:#c9a84c; margin-bottom:14px;
  }
  .already-text {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:14px; line-height:1.75; color:#ddd0b8; margin-bottom:16px;
  }

  /* ── Sparks ── */
  .spark { position:absolute; border-radius:50%; pointer-events:none; opacity:0; }

  /* ── Reset ── */
  .btn-reset {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:12px; letter-spacing:0.12em; color:rgba(180,140,60,0.45);
    background:transparent; border:1px solid rgba(180,140,60,0.2);
    border-radius:4px; padding:7px 16px; cursor:pointer;
    transition:all 0.3s; margin-top:6px;
  }
  .btn-reset:hover { color:#c9a84c; border-color:rgba(180,140,60,0.55); }
</style>
</head>
<body>
<div class="oracle-scene" id="scene">

  <div>
    <div class="logo-text">Illumin&amp;Son</div>
    <div class="sub-text">Oracle du Jour</div>
  </div>
  <div class="divline"></div>
  <div class="ether-text" id="etherText">L'éther se connecte à ton âme…</div>

  <!-- CARTE -->
  <div class="card-stage" id="cardStage">
    <div class="card-glow" id="cardGlow"></div>
    <div class="card-spin" id="cardSpin">
      <!-- DOS — SVG identique carte_3 mais avec fleur de vie -->
      <div class="card-face card-back" id="cardBack"></div>
      <!-- FACE tirée -->
      <div class="card-face card-front" id="cardFront"></div>
    </div>
  </div>

  <button class="btn-reveal" id="btnReveal">✦ &nbsp;Révèle ta carte du jour&nbsp; ✦</button>

  <div class="msg-box" id="msgBox">
    <div class="msg-label">Message du jour</div>
    <div class="msg-text" id="msgText"></div>
  </div>

  <div class="panels" id="panels">
    <div class="panel-row">
      <div class="panel lumiere">
        <span class="panel-label">✦ Lumière</span>
        <span id="panLumiere"></span>
      </div>
      <div class="panel ombre">
        <span class="panel-label">◆ Ombre</span>
        <span id="panOmbre"></span>
      </div>
    </div>
    <div class="panel vigilance">
      <span class="panel-label">⚠ Vigilance</span>
      <span id="panVigilance"></span>
    </div>
  </div>

  <div class="cta-row" id="ctaRow">
    <a class="btn-rdv" href="https://www.sumupbookings.com/illumin-son" target="_blank" rel="noopener">✦ &nbsp;Prendre rendez-vous&nbsp; ✦</a>
    <a class="btn-contact" href="https://www.linktree.com/illumineson" target="_blank" rel="noopener">Nous contacter</a>
  </div>

  <div class="tomorrow-box" id="tomorrowBox">
    <div class="tomorrow-text">Ton oracle se renouvelle chaque jour.<br>Reviens demain pour un nouveau message 🌙</div>
  </div>

  <button class="btn-reset" id="btnReset" style="display:none" onclick="resetDraw()">↺ &nbsp;Réinitialiser le tirage</button>

</div>

// SYMBOLES SACRÉS — 1 géométrie par carte
// Même rendu que carte_3_triangle :
//   - triple trait (ombre + corps + cœur)
//   - cercle guide en pointillés
//   - points aux sommets
//   - centroïde
// cx=125 cy=188 R=58 (cercle circonscrit)
// ══════════════════════════════════════════════════════════
function r(deg){ return deg*Math.PI/180; }

// Triple trait sur un path
function tripleStroke(el){
  return `${el.replace('__SW__','6').replace('__COL__','rgba(60,30,5,0.55)').replace('__OP__','1')}
          ${el.replace('__SW__','3.6').replace('__COL__','#c9a84c').replace('__OP__','1')}
          ${el.replace('__SW__','1.2').replace('__COL__','#f5e098').replace('__OP__','1')}`;
}

// Polygone régulier — retourne les points
function polyPts(cx,cy,rr,n,rot=0){
  let pts=[];
  for(let i=0;i<n;i++){const a=r(-90+rot+i*(360/n));pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
  return pts;
}

// Cercle guide pointillé
function guideCircle(cx,cy,rr){
  return `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="rgba(201,168,76,0.15)" stroke-width="0.6" stroke-dasharray="2 4"/>`;
}
// Cercle inscrit pointillé
function inscrCircle(cx,cy,rr){
  return `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="rgba(201,168,76,0.18)" stroke-width="0.6" stroke-dasharray="1.5 3"/>`;
}
// Points sommets
function dotPts(pts){
  return pts.map(([x,y])=>`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="2.2" fill="#f5e098" opacity="0.88"/>`).join('');
}
// Centroïde
function centroid(cx,cy){
  return `<circle cx="${cx}" cy="${cy}" r="1.8" fill="#f5e098" opacity="0.90"/>`;
}

// Triple polygone
function triPoly(pts, extra=''){
  const pStr = pts.map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
  return `<polygon points="${pStr}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6" stroke-linejoin="round"/>
          <polygon points="${pStr}" fill="none" stroke="#c9a84c" stroke-width="3.6" stroke-linejoin="round"/>
          <polygon points="${pStr}" fill="none" stroke="#f5e098" stroke-width="1.2" stroke-linejoin="round"/>${extra}`;
}

// Triple path
function triPath(d){
  return `<path d="${d}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="${d}" fill="none" stroke="#c9a84c" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="${d}" fill="none" stroke="#f5e098" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>`;
}

function buildSymbol(n){
  const cx=125, cy=188, R=58;
  let svg='';
  switch(n){
    case 0: { // Cercles concentriques — le vide infini
      svg = guideCircle(cx,cy,R)
          + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6"/>
             <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c9a84c" stroke-width="3.6"/>
             <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f5e098" stroke-width="1.2"/>`
          + inscrCircle(cx,cy,R*0.58)
          + inscrCircle(cx,cy,R*0.28)
          + centroid(cx,cy);
      break; }
    case 1: { // Ligne verticale — le premier élan
      svg = guideCircle(cx,cy,R)
          + triPath(`M${cx},${cy-R} L${cx},${cy+R}`)
          + `<circle cx="${cx}" cy="${cy-R}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx}" cy="${cy+R}" r="2.2" fill="#f5e098" opacity="0.88"/>`
          + centroid(cx,cy);
      break; }
    case 2: { // Vésica Piscis — l'alliance
      const d = R;
      svg = guideCircle(cx,cy,R)
          + `<circle cx="${cx-d/2}" cy="${cy}" r="${d}" fill="none" stroke="rgba(60,30,5,0.45)" stroke-width="5"/>
             <circle cx="${cx+d/2}" cy="${cy}" r="${d}" fill="none" stroke="rgba(60,30,5,0.45)" stroke-width="5"/>
             <circle cx="${cx-d/2}" cy="${cy}" r="${d}" fill="none" stroke="#c9a84c" stroke-width="3.2"/>
             <circle cx="${cx+d/2}" cy="${cy}" r="${d}" fill="none" stroke="#c9a84c" stroke-width="3.2"/>
             <circle cx="${cx-d/2}" cy="${cy}" r="${d}" fill="none" stroke="#f5e098" stroke-width="1.1"/>
             <circle cx="${cx+d/2}" cy="${cy}" r="${d}" fill="none" stroke="#f5e098" stroke-width="1.1"/>`
          + centroid(cx,cy);
      break; }
    case 3: { // Triangle équilatéral — la trinité
      const p3 = polyPts(cx,cy,R,3);
      svg = guideCircle(cx,cy,R) + triPoly(p3) + inscrCircle(cx,cy,R/2) + dotPts(p3) + centroid(cx,cy);
      break; }
    case 4: { // Carré — la fondation
      const p4 = polyPts(cx,cy,R,4,45);
      svg = guideCircle(cx,cy,R) + triPoly(p4) + inscrCircle(cx,cy,R*0.7) + dotPts(p4) + centroid(cx,cy);
      break; }
    case 5: { // Pentagone — la liberté
      const p5 = polyPts(cx,cy,R,5);
      svg = guideCircle(cx,cy,R) + triPoly(p5) + inscrCircle(cx,cy,R*0.68) + dotPts(p5) + centroid(cx,cy);
      break; }
    case 6: { // Étoile de David — l'harmonie
      const p6a = polyPts(cx,cy,R,3);
      const p6b = polyPts(cx,cy,R,3,180);
      svg = guideCircle(cx,cy,R) + triPoly(p6a) + triPoly(p6b)
          + inscrCircle(cx,cy,R*0.5)
          + dotPts(p6a) + dotPts(p6b) + centroid(cx,cy);
      break; }
    case 7: { // Heptagone — la quête
      const p7 = polyPts(cx,cy,R,7);
      svg = guideCircle(cx,cy,R) + triPoly(p7) + inscrCircle(cx,cy,R*0.7) + dotPts(p7) + centroid(cx,cy);
      break; }
    case 8: { // Octogone — la puissance
      const p8 = polyPts(cx,cy,R,8);
      svg = guideCircle(cx,cy,R) + triPoly(p8) + inscrCircle(cx,cy,R*0.72) + dotPts(p8) + centroid(cx,cy);
      break; }
    case 9: { // Ennéagone — l'achèvement
      const p9 = polyPts(cx,cy,R,9);
      svg = guideCircle(cx,cy,R) + triPoly(p9) + inscrCircle(cx,cy,R*0.75) + dotPts(p9) + centroid(cx,cy);
      break; }
    case 10: { // Cercle + triangle — renouveau
      const p10 = polyPts(cx,cy,R*0.7,3);
      svg = guideCircle(cx,cy,R)
          + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6"/>
             <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c9a84c" stroke-width="3.6"/>
             <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f5e098" stroke-width="1.2"/>`
          + triPoly(p10) + dotPts(p10) + centroid(cx,cy);
      break; }
    case 11: { // Deux lignes parallèles — nombre maître
      svg = guideCircle(cx,cy,R)
          + triPath(`M${cx-18},${cy-R} L${cx-18},${cy+R}`)
          + triPath(`M${cx+18},${cy-R} L${cx+18},${cy+R}`)
          + `<circle cx="${cx-18}" cy="${cy-R}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx-18}" cy="${cy+R}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx+18}" cy="${cy-R}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx+18}" cy="${cy+R}" r="2.2" fill="#f5e098" opacity="0.88"/>`
          + centroid(cx,cy);
      break; }
    case 12: { // Dodécagone — cycles
      const p12 = polyPts(cx,cy,R,12);
      svg = guideCircle(cx,cy,R) + triPoly(p12) + inscrCircle(cx,cy,R*0.8) + dotPts(p12) + centroid(cx,cy);
      break; }
    case 13: { // Triangle inversé + cercle — transformation
      const p13 = polyPts(cx,cy,R,3,180);
      svg = guideCircle(cx,cy,R) + triPoly(p13)
          + `<circle cx="${cx}" cy="${cy}" r="${R*0.5}" fill="none" stroke="#c9a84c" stroke-width="1.8"/>
             <circle cx="${cx}" cy="${cy}" r="${R*0.5}" fill="none" stroke="#f5e098" stroke-width="0.7"/>`
          + dotPts(p13) + centroid(cx,cy);
      break; }
    case 14: { // Rectangle vertical — tempérance
      const rw=R*0.9, rh=R*1.4;
      svg = guideCircle(cx,cy,R)
          + `<rect x="${cx-rw/2}" y="${cy-rh/2}" width="${rw}" height="${rh}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6" stroke-linejoin="round"/>
             <rect x="${cx-rw/2}" y="${cy-rh/2}" width="${rw}" height="${rh}" fill="none" stroke="#c9a84c" stroke-width="3.6" stroke-linejoin="round"/>
             <rect x="${cx-rw/2}" y="${cy-rh/2}" width="${rw}" height="${rh}" fill="none" stroke="#f5e098" stroke-width="1.2" stroke-linejoin="round"/>`
          + inscrCircle(cx,cy,R*0.45)
          + `<circle cx="${cx-rw/2}" cy="${cy-rh/2}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx+rw/2}" cy="${cy-rh/2}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx-rw/2}" cy="${cy+rh/2}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${cx+rw/2}" cy="${cy+rh/2}" r="2.2" fill="#f5e098" opacity="0.88"/>`
          + centroid(cx,cy);
      break; }
    case 15: { // Pentagone + étoile intérieure — attachement
      const p15 = polyPts(cx,cy,R,5);
      const p15i = polyPts(cx,cy,R*0.55,5);
      const star5d = [0,2,4,1,3,0].map((i,idx)=>(idx===0?'M':'L')+p15i[i][0].toFixed(2)+','+p15i[i][1].toFixed(2)).join(' ')+'Z';
      svg = guideCircle(cx,cy,R) + triPoly(p15)
          + `<path d="${star5d}" fill="none" stroke="#c9a84c" stroke-width="1.4"/>
             <path d="${star5d}" fill="none" stroke="#f5e098" stroke-width="0.5"/>`
          + dotPts(p15) + centroid(cx,cy);
      break; }
    case 16: { // Éclair — la révélation
      const lx=cx, ly=cy;
      const ld=`M${lx+10},${ly-R} L${lx-12},${ly-2} L${lx+7},${ly-2} L${lx-10},${ly+R}`;
      svg = guideCircle(cx,cy,R) + triPath(ld)
          + `<circle cx="${lx+10}" cy="${ly-R}" r="2.2" fill="#f5e098" opacity="0.88"/>
             <circle cx="${lx-10}" cy="${ly+R}" r="2.2" fill="#f5e098" opacity="0.88"/>`;
      break; }
    case 17: { // Étoile à 8 branches — l'étoile
      const r8=R, ri=R*0.42;
      let d8='';
      for(let i=0;i<8;i++){
        const a1=r(-90+i*45),a2=r(-90+i*45+22.5);
        d8+=(i===0?'M':'L')+`${(cx+r8*Math.cos(a1)).toFixed(2)},${(cy+r8*Math.sin(a1)).toFixed(2)} L${(cx+ri*Math.cos(a2)).toFixed(2)},${(cy+ri*Math.sin(a2)).toFixed(2)} `;
      }
      d8+='Z';
      svg = guideCircle(cx,cy,R) + triPath(d8) + centroid(cx,cy);
      break; }
    case 18: { // Croissant + cercle — l'illusion
      svg = guideCircle(cx,cy,R)
          + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6"/>
             <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c9a84c" stroke-width="3.6"/>
             <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#f5e098" stroke-width="1.2"/>
             <circle cx="${cx+R*0.38}" cy="${cy}" r="${R}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6"/>
             <circle cx="${cx+R*0.38}" cy="${cy}" r="${R}" fill="none" stroke="#c9a84c" stroke-width="3.6"/>
             <circle cx="${cx+R*0.38}" cy="${cy}" r="${R}" fill="none" stroke="#f5e098" stroke-width="1.2"/>`
          + centroid(cx,cy);
      break; }
    case 19: { // Soleil — rayons
      let rays='';
      for(let i=0;i<12;i++){
        const a=r(i*30);
        const x1=cx+(R*0.45)*Math.cos(a), y1=cy+(R*0.45)*Math.sin(a);
        const x2=cx+R*Math.cos(a), y2=cy+R*Math.sin(a);
        rays+=`<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="rgba(60,30,5,0.55)" stroke-width="5"/>
               <line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#c9a84c" stroke-width="2.8"/>
               <line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#f5e098" stroke-width="1.0"/>`;
      }
      svg = guideCircle(cx,cy,R) + rays
          + `<circle cx="${cx}" cy="${cy}" r="${R*0.4}" fill="none" stroke="rgba(60,30,5,0.55)" stroke-width="6"/>
             <circle cx="${cx}" cy="${cy}" r="${R*0.4}" fill="none" stroke="#c9a84c" stroke-width="3.6"/>
             <circle cx="${cx}" cy="${cy}" r="${R*0.4}" fill="none" stroke="#f5e098" stroke-width="1.2"/>`
          + centroid(cx,cy);
      break; }
    case 20: { // Hexagone + triangle — l'éveil
      const p20h = polyPts(cx,cy,R,6);
      const p20t = polyPts(cx,cy,R*0.6,3);
      svg = guideCircle(cx,cy,R) + triPoly(p20h) + triPoly(p20t)
          + dotPts(p20h) + centroid(cx,cy);
      break; }
    case 21: { // Heptagone double — l'accomplissement
      const p21a = polyPts(cx,cy,R,7);
      const p21b = polyPts(cx,cy,R*0.58,7,25.7);
      svg = guideCircle(cx,cy,R) + triPoly(p21a) + triPoly(p21b)
          + dotPts(p21a) + centroid(cx,cy);
      break; }
    case 22: { // Carrés imbriqués — le maître bâtisseur
      const sq = (rr,rot=0) => {
        const pts=polyPts(cx,cy,rr,4,rot);
        return triPoly(pts);
      };
      svg = guideCircle(cx,cy,R) + sq(R,45) + sq(R*0.7,0) + sq(R*0.42,45)
          + centroid(cx,cy);
      break; }
    case 23: { // Octogone — la grâce
      const p23 = polyPts(cx,cy,R,8,22.5);
      svg = guideCircle(cx,cy,R) + triPoly(p23) + inscrCircle(cx,cy,R*0.75)
          + dotPts(p23) + centroid(cx,cy);
      break; }
    case 24: { // Double triangle + cercle — amour actif
      const p24a = polyPts(cx,cy,R,3);
      const p24b = polyPts(cx,cy,R,3,180);
      const p24c = polyPts(cx,cy,R*0.5,3);
      svg = guideCircle(cx,cy,R) + triPoly(p24a) + triPoly(p24b) + triPoly(p24c)
          + dotPts(p24a) + centroid(cx,cy);
      break; }
    case 25: { // Décagone — sagesse intuitive
      const p25 = polyPts(cx,cy,R,10);
      svg = guideCircle(cx,cy,R) + triPoly(p25) + inscrCircle(cx,cy,R*0.77)
          + dotPts(p25) + centroid(cx,cy);
      break; }
    case 26: { // Carré + hexagone — pouvoir ancré
      const p26h = polyPts(cx,cy,R*0.7,6);
      const p26s = polyPts(cx,cy,R,4,45);
      svg = guideCircle(cx,cy,R) + triPoly(p26s) + triPoly(p26h)
          + dotPts(p26s) + centroid(cx,cy);
      break; }
    case 27: { // Ennéagone double — l'inspiration
      const p27a = polyPts(cx,cy,R,9,-10);
      const p27b = polyPts(cx,cy,R*0.58,9,10);
      svg = guideCircle(cx,cy,R) + triPoly(p27a) + triPoly(p27b)
          + dotPts(p27a) + centroid(cx,cy);
      break; }
    case 28: { // Étoile 8 + cercle — chef solitaire
      const r28=R, ri28=R*0.4;
      let d28='';
      for(let i=0;i<8;i++){
        const a1=r(-90+i*45),a2=r(-90+i*45+22.5);
        d28+=(i===0?'M':'L')+`${(cx+r28*Math.cos(a1)).toFixed(2)},${(cy+r28*Math.sin(a1)).toFixed(2)} L${(cx+ri28*Math.cos(a2)).toFixed(2)},${(cy+ri28*Math.sin(a2)).toFixed(2)} `;
      }
      d28+='Z';
      svg = guideCircle(cx,cy,R) + triPath(d28) + inscrCircle(cx,cy,R*0.38) + centroid(cx,cy);
      break; }
    case 29: { // Hendécagone — l'épreuve
      const p29 = polyPts(cx,cy,R,11);
      svg = guideCircle(cx,cy,R) + triPoly(p29) + inscrCircle(cx,cy,R*0.79)
          + dotPts(p29) + centroid(cx,cy);
      break; }
    case 30: { // Fleur de vie — créativité pure
      const rf=R*0.38;
      const centers=[[0,0]];
      for(let i=0;i<6;i++){const a=r(i*60);centers.push([rf*2*Math.cos(a),rf*2*Math.sin(a)]);}
      let petals='';
      centers.forEach(([dx,dy])=>{
        petals+=`<circle cx="${(cx+dx).toFixed(2)}" cy="${(cy+dy).toFixed(2)}" r="${rf}" fill="none" stroke="rgba(60,30,5,0.4)" stroke-width="5"/>
                 <circle cx="${(cx+dx).toFixed(2)}" cy="${(cy+dy).toFixed(2)}" r="${rf}" fill="none" stroke="#c9a84c" stroke-width="3"/>
                 <circle cx="${(cx+dx).toFixed(2)}" cy="${(cy+dy).toFixed(2)}" r="${rf}" fill="none" stroke="#f5e098" stroke-width="1.1"/>`;
      });
      svg = guideCircle(cx,cy,R) + petals
          + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.8"/>`
          + centroid(cx,cy);
      break; }
    case 31: { // Dodécagone + carré — création ancrée
      const p31 = polyPts(cx,cy,R,12,15);
      const p31s = polyPts(cx,cy,R*0.52,4,45);
      svg = guideCircle(cx,cy,R) + triPoly(p31) + triPoly(p31s)
          + dotPts(p31) + centroid(cx,cy);
      break; }
    case 32: { // Cube de Métatron — la parole sacrée
      const rm=R*0.36;
      const pos32=[[0,0]];
      for(let i=0;i<6;i++){const a=r(i*60);pos32.push([rm*2*Math.cos(a),rm*2*Math.sin(a)]);}
      let lines32='',circles32='';
      for(let i=0;i<pos32.length;i++)for(let j=i+1;j<pos32.length;j++){
        lines32+=`<line x1="${(cx+pos32[i][0]).toFixed(2)}" y1="${(cy+pos32[i][1]).toFixed(2)}" x2="${(cx+pos32[j][0]).toFixed(2)}" y2="${(cy+pos32[j][1]).toFixed(2)}" stroke="rgba(201,168,76,0.18)" stroke-width="0.5"/>`;
      }
      pos32.forEach(([dx,dy])=>{
        circles32+=`<circle cx="${(cx+dx).toFixed(2)}" cy="${(cy+dy).toFixed(2)}" r="${rm}" fill="none" stroke="rgba(60,30,5,0.4)" stroke-width="4"/>
                    <circle cx="${(cx+dx).toFixed(2)}" cy="${(cy+dy).toFixed(2)}" r="${rm}" fill="none" stroke="#c9a84c" stroke-width="2.6"/>
                    <circle cx="${(cx+dx).toFixed(2)}" cy="${(cy+dy).toFixed(2)}" r="${rm}" fill="none" stroke="#f5e098" stroke-width="0.9"/>`;
      });
      svg = guideCircle(cx,cy,R) + lines32 + circles32 + centroid(cx,cy);
      break; }
    case 33: { // Hexagone triple + centre — maître enseignant
      const p33a = polyPts(cx,cy,R,6);
      const p33b = polyPts(cx,cy,R*0.68,6,30);
      const p33c = polyPts(cx,cy,R*0.38,6);
      svg = guideCircle(cx,cy,R) + triPoly(p33a) + triPoly(p33b) + triPoly(p33c)
          + dotPts(p33a)
          + `<circle cx="${cx}" cy="${cy}" r="5" fill="#f5e098" opacity="0.3"/>`
          + centroid(cx,cy);
      break; }
    default:
      svg = guideCircle(cx,cy,R)
          + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#c9a84c" stroke-width="3.6"/>`;
  }
  return svg;
}

// ══════════════════════════════════════════════════════════
// GÉNÈRE LE SVG COMPLET D'UNE CARTE (250×375)
// Identique à carte_3_triangle.html
// Losanges positionnés dynamiquement selon la largeur du texte
// ══════════════════════════════════════════════════════════
function buildCardSVG(carte, isDos=false){
  const CX=125, CY=188;

  // Calcul de la largeur approximative du texte du titre
  // Police Georgia 10px, letter-spacing 2.5px
  // Approximation : chaque caractère ~6px + spacing
  const titre = isDos ? 'ORACLE' : carte.titre.toUpperCase();
  const charW = 5.8;
  const spacing = 2.5;
  const textW = titre.length * charW + (titre.length - 1) * spacing;
  const gap = 8; // espace entre texte et losange
  const lozW = 2.5; // demi-diagonale losange

  const lozLx = 125 - textW/2 - gap - lozW;
  const lozRx = 125 + textW/2 + gap + lozW;
  const lozY  = 327;

  const numStr = isDos ? '' : String(carte.n);

  let symbolContent = isDos
    ? `<!-- Fleur de vie dos -->
       <g fill="none">
         ${buildSymbol(30) /* fleur de vie = carte 30 */}
       </g>`
    : `<g fill="none">${buildSymbol(carte.n)}</g>`;

  return `<svg width="250" height="375" viewBox="0 0 250 375" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="20%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%"   stop-color="#040d28"/>
    <stop offset="35%"  stop-color="#091a52"/>
    <stop offset="65%"  stop-color="#0c2068"/>
    <stop offset="100%" stop-color="#050b20"/>
  </linearGradient>
  <linearGradient id="gd" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#f5e098"/>
    <stop offset="45%"  stop-color="#c9a84c"/>
    <stop offset="100%" stop-color="#7a4e18"/>
  </linearGradient>
  <linearGradient id="gdH" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#f5e098"/>
    <stop offset="50%"  stop-color="#c9a84c"/>
    <stop offset="100%" stop-color="#7a4e18"/>
  </linearGradient>
  <radialGradient id="cg" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="rgba(190,150,60,0.12)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <clipPath id="cl"><rect width="250" height="375" rx="12" ry="12"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="250" height="375" fill="url(#bg)"/>
  <rect width="250" height="375" fill="url(#cg)"/>

  ${symbolContent}

  <!-- LOGO -->
  <text x="125" y="36" text-anchor="middle"
    font-family="'Cinzel Decorative',serif"
    font-size="13" fill="url(#gd)" opacity="0.90" letter-spacing="0.5">Illumin&amp;Son</text>
  <line x1="82" y1="43" x2="168" y2="43" stroke="url(#gdH)" stroke-width="0.5" opacity="0.32"/>

  <!-- NOM DU SYMBOLE + LOSANGES -->
  <polygon points="${lozLx},${lozY-2.5} ${lozLx+2.5},${lozY} ${lozLx},${lozY+2.5} ${lozLx-2.5},${lozY}"
    fill="#c9a84c" opacity="0.80"/>
  <text x="125" y="330" text-anchor="middle"
    font-family="Georgia,serif"
    font-size="10" fill="#f0d080" opacity="0.85" letter-spacing="2.5">${titre}</text>
  <polygon points="${lozRx},${lozY-2.5} ${lozRx+2.5},${lozY} ${lozRx},${lozY+2.5} ${lozRx-2.5},${lozY}"
    fill="#c9a84c" opacity="0.80"/>

  <!-- NUMÉRO -->
  <text x="125" y="352" text-anchor="middle"
    font-family="'Cormorant Garamond',serif"
    font-size="13" fill="url(#gd)" opacity="0.76" letter-spacing="4">${numStr}</text>

  <!-- LISERÉ EXTÉRIEUR -->
  <rect x="0.75" y="0.75" width="248.5" height="373.5" rx="11.5" ry="11.5"
        fill="none" stroke="url(#gd)" stroke-width="1.5" opacity="0.28"/>
  <!-- LISERÉ INTÉRIEUR -->
  <rect x="11" y="11" width="228" height="353" rx="7" ry="7"
        fill="none" stroke="url(#gd)" stroke-width="1.2" opacity="0.78"/>
  <!-- ÉQUERRES -->
  <polyline points="16,28 16,16 28,16" fill="none" stroke="url(#gd)" stroke-width="1.3" stroke-linecap="square" opacity="0.88"/>
  <rect x="18" y="18" width="5" height="5" fill="none" stroke="url(#gd)" stroke-width="0.8" opacity="0.65"/>
  <polyline points="234,28 234,16 222,16" fill="none" stroke="url(#gd)" stroke-width="1.3" stroke-linecap="square" opacity="0.88"/>
  <rect x="227" y="18" width="5" height="5" fill="none" stroke="url(#gd)" stroke-width="0.8" opacity="0.65"/>
  <polyline points="16,348 16,360 28,360" fill="none" stroke="url(#gd)" stroke-width="1.3" stroke-linecap="square" opacity="0.88"/>
  <rect x="18" y="351" width="5" height="5" fill="none" stroke="url(#gd)" stroke-width="0.8" opacity="0.65"/>
  <polyline points="234,348 234,360 222,360" fill="none" stroke="url(#gd)" stroke-width="1.3" stroke-linecap="square" opacity="0.88"/>
  <rect x="227" y="351" width="5" height="5" fill="none" stroke="url(#gd)" stroke-width="0.8" opacity="0.65"/>
</g>
</svg>`;
}

// ══════════════════════════════════════
// TIRAGE 1 PAR JOUR
// ══════════════════════════════════════
function getToday(){ return new Date().toISOString().slice(0,10); }

function resetDraw(){
  localStorage.removeItem('illuminson_oracle_v2');
  location.reload();
}

function showResetBtn(){
  document.getElementById('btnReset').style.display='inline-block';
}

function getStoredDraw(){
  try{
    const raw=localStorage.getItem('illuminson_oracle_v2');
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(obj.date!==getToday()) return null;
    return obj;
  }catch(e){ return null; }
}
function storeDraw(n){ localStorage.setItem('illuminson_oracle_v2',JSON.stringify({date:getToday(),n})); }

// ══════════════════════════════════════
// SPARKS
// ══════════════════════════════════════
function spawnSpark(){
  const scene=document.getElementById('scene');
  const stage=document.getElementById('cardStage');
  const sr=stage.getBoundingClientRect(), scr=scene.getBoundingClientRect();
  const s=document.createElement('div'); s.className='spark';
  const sz=2+Math.random()*4;
  s.style.width=s.style.height=sz+'px';
  s.style.left=(sr.left-scr.left+Math.random()*sr.width)+'px';
  s.style.top=(sr.top-scr.top+Math.random()*sr.height)+'px';
  s.style.background=Math.random()>0.4?'#f0d080':'#c9a84c';
  scene.appendChild(s);
  const rise=-60-Math.random()*80, drift=(Math.random()-0.5)*40, dur=900+Math.random()*700;
  s.animate([
    {opacity:0,transform:'translate(0,0) scale(0.3)'},
    {opacity:0.9,transform:`translate(${drift*.3}px,${rise*.3}px) scale(1)`,offset:0.2},
    {opacity:0.4,transform:`translate(${drift}px,${rise}px) scale(0.6)`,offset:0.8},
    {opacity:0,transform:`translate(${drift*1.1}px,${rise*1.2}px) scale(0)`}
  ],{duration:dur,easing:'ease-out'});
  setTimeout(()=>s.remove(),dur);
}

// ══════════════════════════════════════
// EASING
// ══════════════════════════════════════
function customEase(t){
  if(t<0.55){const t2=t/0.55;return 0.55*(t2*t2*(3-2*t2))*0.72;}
  else{const t2=(t-0.55)/0.45;const e=1-Math.pow(1-t2,5);return 0.395+e*0.605;}
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  // Injecter le dos de la carte (fleur de vie)
  document.getElementById('cardBack').innerHTML = buildCardSVG(null, true);

  const stored=getStoredDraw();
  if(stored!==null){
    showAlreadyDrawn(stored.n);
  } else {
    document.getElementById('btnReveal').addEventListener('click',startSequence);
  }
});

function showAlreadyDrawn(n){
  const c=CARTES[n];
  // Injecter la face tirée dans la carte existante et la retourner
  document.getElementById('cardFront').innerHTML = buildCardSVG(c, false);
  document.getElementById('cardSpin').style.transform = 'rotateY(180deg)';
  document.getElementById('btnReveal').style.display='none';
  document.getElementById('etherText').style.display='none';
  const scene=document.getElementById('scene');
  const box=document.createElement('div');
  box.className='already-box';
  box.innerHTML=`
    <div class="already-title">Ta carte du jour</div>
    <div class="already-text">${c.msg}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      <div class="panel lumiere" style="flex:1;min-width:120px;border-radius:8px;padding:10px 13px;font-size:13px;line-height:1.55;">
        <span class="panel-label">✦ Lumière</span>${c.lumiere}</div>
      <div class="panel ombre" style="flex:1;min-width:120px;border-radius:8px;padding:10px 13px;font-size:13px;line-height:1.55;">
        <span class="panel-label">◆ Ombre</span>${c.ombre}</div>
    </div>
    <div class="panel vigilance" style="border-radius:8px;padding:10px 13px;font-size:13px;line-height:1.55;margin-bottom:14px;">
      <span class="panel-label">⚠ Vigilance</span>${c.vigilance}</div>
    <div class="tomorrow-text" style="margin-bottom:14px;">Reviens demain pour un nouveau tirage 🌙</div>
    <a class="btn-rdv" href="https://www.sumupbookings.com/illumin-son" target="_blank" rel="noopener" style="margin-bottom:10px;">✦ &nbsp;Prendre rendez-vous&nbsp; ✦</a>
    <a class="btn-contact" href="https://www.linktree.com/illumineson" target="_blank" rel="noopener">Nous contacter</a>`;
  scene.appendChild(box);
  showResetBtn();
}

let started=false;
function startSequence(){
  if(started) return;
  started=true;
  const n=Math.floor(Math.random()*34);
  storeDraw(n);
  const c=CARTES[n];

  // Injecter la face tirée
  document.getElementById('cardFront').innerHTML = buildCardSVG(c, false);

  document.getElementById('btnReveal').style.display='none';
  const etherText=document.getElementById('etherText');
  const card=document.getElementById('cardSpin');
  const glow=document.getElementById('cardGlow');

  etherText.classList.add('visible');
  setTimeout(()=>{
    etherText.classList.remove('visible');
    const totalDuration=5000, totalRotation=5*360+180;
    const startTime=performance.now();
    let lastSpark=0;
    function frame(now){
      const elapsed=now-startTime, t=Math.min(elapsed/totalDuration,1);
      const angle=customEase(t)*totalRotation;
      card.style.transform=`rotateY(${angle}deg)`;
      const gi=t<0.55?0.7:(1-(t-0.55)/0.45)*0.7;
      glow.style.opacity=gi;
      glow.style.boxShadow=`0 0 ${30+gi*40}px rgba(201,168,76,${gi*0.6})`;
      const sf=t<0.55?110:110+((t-0.55)/0.45)*500;
      if(now-lastSpark>sf&&t<0.96){spawnSpark();lastSpark=now;}
      if(t<1){ requestAnimationFrame(frame); }
      else {
        card.style.transform='rotateY(180deg)';
        glow.style.opacity='0';
        for(let i=0;i<16;i++) setTimeout(spawnSpark,i*55);
        setTimeout(()=>{
          document.getElementById('msgText').textContent=c.msg;
          document.getElementById('panLumiere').textContent=c.lumiere;
          document.getElementById('panOmbre').textContent=c.ombre;
          document.getElementById('panVigilance').textContent=c.vigilance;
          document.getElementById('msgBox').classList.add('show');
          document.getElementById('panels').classList.add('show');
          document.getElementById('ctaRow').classList.add('show');
          document.getElementById('tomorrowBox').classList.add('show');
          showResetBtn();
        },800);
      }
    }
    requestAnimationFrame(frame);
  },1000);
}
</script>
